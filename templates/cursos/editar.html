{% extends 'layouts/base.html' %}
{% block title %}Editar Curso | Gestor de Cursos{% endblock %}
{% block extra_head %}<style>
  /* Estilos para los campos generados por Django */
  form p {
    margin-bottom: 1.25rem;
  }

  form p label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: #334155;
  }

  form input,
  form textarea,
  form select {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    padding: 0.65rem 0.75rem;
    font-size: 0.875rem;
    color: #1e293b;
    background-color: #ffffff;
    outline: none;
    transition: all 0.2s;
  }

  form input:focus,
  form textarea:focus,
  form select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  form textarea {
    min-height: 140px;
    resize: vertical;
  }

  form ul.errorlist {
    margin-bottom: 0.5rem;
    padding: 0;
    list-style: none;
    color: #dc2626;
    font-size: 0.75rem;
  }

  form .helptext {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.75rem;
    color: #94a3b8;
  }
</style>{% endblock %}
{% block content %}
<main class="mx-auto max-w-3xl px-6 py-10">

  <section
    class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
  >

    <!-- Cabecera del formulario -->
    <div class="border-b border-slate-200 px-6 py-6 sm:px-8">

      <div class="flex items-start gap-4">

        <!-- Icono -->
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18s-3.332.477-4.5 1.253"
            />
          </svg>
        </div>

        <div>
          <h2 class="text-lg font-bold text-slate-900">
            Información del curso
          </h2>

          <p class="mt-1 text-sm leading-6 text-slate-500">
            Completa los siguientes campos para actualizar este curso.
          </p>
        </div>

      </div>

    </div>

    <!-- Formulario -->
    <form enctype="multipart/form-data" method="POST" class="px-6 py-6 sm:px-8">

      {% csrf_token %}

      {{ form.as_p }}

      <!-- Acciones -->
      <div
        class="mt-8 flex flex-col gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:justify-end"
      >

        <!-- Cancelar -->
        <a
          href="{% url 'lista_cursos' %}"
          class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
        >
          Cancelar
        </a>

        <!-- Guardar -->
        <button
          type="submit"
          class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>

          Guardar cambios

        </button>

      </div>

    </form>

  </section>

</main>
{% endblock %}
