{% load static %}
<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Lección | Gestor de Cursos</title>

<!-- Tailwind CSS -->
<link rel="stylesheet" href="{% static 'css/styles.css' %}">

<style>
  /* Estilos para los campos generados por Django */
  form p {
    margin-bottom: 1.25rem;
  }

  form p label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: #334155;
  }

  form input,
  form textarea,
  form select {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    padding: 0.65rem 0.75rem;
    font-size: 0.875rem;
    color: #1e293b;
    background-color: #ffffff;
    outline: none;
    transition: all 0.2s;
  }

  form input:focus,
  form textarea:focus,
  form select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  form textarea {
    min-height: 140px;
    resize: vertical;
  }

  form ul.errorlist {
    margin-bottom: 0.5rem;
    padding: 0;
    list-style: none;
    color: #dc2626;
    font-size: 0.75rem;
  }

  form .helptext {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.75rem;
    color: #94a3b8;
  }
</style>
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-800">

<!-- Encabezado -->
<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto max-w-7xl px-6 py-5">

    <p class="text-sm font-medium text-indigo-600">
      Gestor de cursos
    </p>

    <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900">
      Editar lección
    </h1>

  </div>
</header>

<!-- Contenido principal -->
<main class="mx-auto max-w-3xl px-6 py-10">

  <!-- Tarjeta del formulario -->
  <section
    class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
  >

    <!-- Información de la lección -->
    <div class="border-b border-slate-200 px-6 py-6 sm:px-8">

      <div class="flex items-start gap-4">

        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 20h9"
            />

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 3.5a2.121 2.121 0 013 3L8 18l-4 1 1-4L16.5 3.5z"
            />
          </svg>
        </div>

        <div>
          <h2 class="text-lg font-bold text-slate-900">
            {{ leccion.titulo }}
          </h2>

          <p class="mt-1 text-sm text-slate-500">
            Modifica la información de esta lección y guarda los cambios.
          </p>
        </div>

      </div>

    </div>

    <!-- Formulario -->
    <form method="POST" class="px-6 py-6 sm:px-8">

      {% csrf_token %}

      {{ form.as_p }}

      <!-- Botones -->
      <div
        class="mt-8 flex flex-col gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:justify-end"
      >

        <a
          href="{% url 'detalle_curso' leccion.curso.pk %}"
          class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
        >
          Cancelar
        </a>

        <button
          type="submit"
          class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          Guardar cambios
        </button>

      </div>

    </form>

  </section>

</main>
  </body>
</html>
